<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience 01 · Le Dévoilement</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
/*
  EXPERIENCE 01 — LE DÉVOILEMENT (the unveiling).
  Press a perfume: the room dims, the bottle lifts out of its photograph and
  stands, catches the light as you move, and its notes evaporate out of the
  nozzle — top, heart, base — to orbit it at three heights, as a perfume is
  described. Everything about the bottle comes from its own photograph
  (tools/bottle_to_25d.py): nothing is invented about the packaging.
*/
.intro { padding-block: 64px 40px; max-width: 760px; }
.intro h1 { font-size: 52px; margin-top: 18px; }
.intro p { margin-top: 14px; color: var(--ink2); font-size: 18px; }
.cards { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 96px; }
.card { border: 1px solid var(--line); background: var(--raised); cursor: pointer; transition: border-color var(--base) var(--out), transform var(--slow) var(--out); }
.card:hover { border-color: var(--ink); transform: translateY(-4px); }
.card figure { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #ddd; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s var(--out); }
.card:hover img { transform: scale(1.04); }
/* A teaser of the glass: a sheen crosses the photograph under the pointer. */
.card figure::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 48%, transparent 60%); transform: translateX(120%); transition: transform 1.1s var(--out); pointer-events: none; }
.card:hover figure::after { transform: translateX(-120%); }
.card .hint { position: absolute; inset-block-end: 14px; inset-inline-start: 14px; background: var(--ink); color: var(--ground); font-size: 12px; padding: 6px 12px; opacity: 0; transform: translateY(6px); transition: opacity var(--base) var(--out), transform var(--base) var(--out); }
.card:hover .hint { opacity: 1; transform: none; }
.card .meta { padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.card .house { font-size: 10px; color: var(--ink3); }
.card .name { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.card .price { font-family: var(--f-label); font-size: 15px; }

/* ------------------------------------------------------------------ stage */
.stage { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: 400px 1fr; color: var(--ink); }
.stage[hidden] { display: none; }
.veil { position: absolute; inset: 0; background:
  radial-gradient(120% 90% at 40% 45%, #2C2926 0%, #201E1C 55%, #161412 100%); opacity: 0; transition: opacity 700ms var(--inout); }
.stage.open .veil { opacity: 1; }
.flier { position: fixed; z-index: 6; object-fit: cover; pointer-events: none; will-change: transform, opacity; }
/* The scene spans the whole stage, under the panel: the bottle has to be able
   to travel back into a card anywhere on the page. */
.scene { position: relative; grid-column: 1 / -1; grid-row: 1; height: 100vh; overflow: hidden; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Drawn at half resolution and softened: mist has no edges. */
.scene .mist { z-index: 1; mix-blend-mode: screen; filter: blur(3px); opacity: 0; transition: opacity 600ms var(--out); }
.stage.open .scene .mist { opacity: 1; }
.scene .glass { z-index: 2; }
.notes { position: absolute; inset: 0; pointer-events: none; }
.note-chip { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 11px; white-space: nowrap;
  background: rgba(42, 39, 37, .78); border: 1px solid rgba(248, 243, 235, .16); color: var(--ink); font-size: 14px; backdrop-filter: blur(6px);
  will-change: transform, opacity; pointer-events: auto; transition: border-color var(--base) var(--out); }
.note-chip .en { font-family: var(--f-label); font-size: 9.5px; letter-spacing: 1.8px; color: var(--ink3); text-transform: uppercase; }
.note-chip svg { color: var(--mist); }
.note-chip:hover { border-color: var(--mist); }
.tier-guide { position: absolute; inset-inline-end: 34px; z-index: 4; display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--ink3); opacity: 0; transition: opacity var(--slow) var(--out); }
.tier-guide .latin { font-size: 9.5px; letter-spacing: 2px; }
.tier-guide::before { content: ''; width: 28px; height: 1px; background: currentColor; align-self: center; }
.tier-guide.on { opacity: 1; }
.plinth { position: absolute; z-index: 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(248,243,235,.07), rgba(248,243,235,.02) 60%, transparent); transform: translate(-50%, -50%); opacity: 0; transition: opacity 900ms var(--out); }
.stage.open .plinth { opacity: 1; }

.panel { position: relative; z-index: 5; grid-column: 1; grid-row: 1; align-self: center; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; }
.panel > * { opacity: 0; transform: translateY(14px); transition: opacity var(--slow) var(--entrance), transform var(--slow) var(--entrance); }
.stage.revealed .panel > * { opacity: 1; transform: none; }
.panel > *:nth-child(2) { transition-delay: 80ms } .panel > *:nth-child(3) { transition-delay: 160ms } .panel > *:nth-child(4) { transition-delay: 240ms }
.panel > *:nth-child(5) { transition-delay: 320ms } .panel > *:nth-child(6) { transition-delay: 400ms } .panel > *:nth-child(7) { transition-delay: 480ms }
.panel h2 { font-size: 44px; line-height: 1.2; }
.panel .en-name { font-family: var(--f-latin); font-style: italic; font-weight: 300; font-size: 20px; color: var(--ink2); direction: ltr; text-align: end; margin-top: -10px; }
.panel dl { display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--line); }
.panel dt, .panel dd { padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.panel dt { color: var(--ink3); padding-inline-end: 24px; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; margin-inline-end: 10px; }
.meter i { width: 18px; height: 3px; background: var(--line); } .meter i.on { background: var(--ink); }
.family-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mist); margin-inline-end: 8px; vertical-align: middle; }
.price { font-family: var(--f-label); font-size: 26px; letter-spacing: 1px; }
.price small { font-size: 10px; letter-spacing: 2px; color: var(--ink3); margin-inline-start: 6px; }
.buy { position: relative; isolation: isolate; overflow: hidden; height: 52px; background: var(--ink); color: var(--ground); font-weight: 500; font-size: 16px; }
.buy::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--accent); transform: scaleX(0); transform-origin: right; transition: transform var(--slow) var(--out); }
.buy:hover::before { transform: scaleX(1); } .buy:hover { color: var(--on-accent); }
.close { position: absolute; z-index: 7; top: 24px; inset-inline-end: 28px; width: 44px; height: 44px; border: 1px solid var(--line); color: var(--ink2); font-size: 20px; opacity: 0; transition: opacity var(--slow) var(--out), border-color var(--base) var(--out), color var(--base) var(--out); }
.stage.revealed .close { opacity: 1; }
.close:hover { border-color: var(--accent); color: var(--accent); }
.drag-hint { position: absolute; z-index: 4; inset-block-end: 28px; left: 0; display: flex; gap: 10px; align-items: baseline; white-space: nowrap; font-size: 12px; color: var(--ink3); opacity: 0; transition: opacity 300ms var(--out); }
.drag-hint .latin { font-size: 9.5px; letter-spacing: 2px; }
.stage.revealed .drag-hint { opacity: .8; transition: opacity 1s var(--out) 1.2s; }
</style>
</head>
<body>
<header class="wrap mast">
  <span class="wordmark">DIYAR</span>
  <nav><a aria-current="page" href="01-devoilement.html">Le Dévoilement</a><a href="02-la-duree.html">La Durée</a><a href="03-carte-olfactive.html">La Carte</a><a href="04-details.html">Les Détails</a></nav>
</header>
<main class="wrap">
  <section class="intro">
    <span class="kicker">Experience 01 — Le Dévoilement</span>
    <h1 class="display">اكشف العطر</h1>
    <p>اضغط على أي عطر: تخفت الإضاءة، وتخرج القارورة من صورتها، وتتصاعد نفحاته من فوّهتها — القمة، فالقلب، فالقاعدة.</p>
  </section>
  <ul class="cards" id="cards"></ul>
</main>

<div class="stage noir" id="stage" role="dialog" aria-modal="true" aria-labelledby="stage-name" hidden>
  <div class="veil"></div>
  <div class="scene" id="scene">
    <div class="plinth" id="plinth"></div>
    <canvas class="mist" id="mist"></canvas>
    <div class="notes" id="notes-back" style="z-index:1"></div>
    <canvas class="glass" id="glass"></canvas>
    <div class="notes" id="notes-front" style="z-index:3"></div>
    <span class="tier-guide" data-tier="top"><span class="latin">TOP</span>القمة</span>
    <span class="tier-guide" data-tier="heart"><span class="latin">HEART</span>القلب</span>
    <span class="tier-guide" data-tier="base"><span class="latin">BASE</span>القاعدة</span>
    <span class="drag-hint"><span class="latin">MOVE TO TURN THE LIGHT</span><span>حرّك المؤشر</span></span>
  </div>
  <aside class="panel" id="panel"></aside>
  <button class="close" id="close" aria-label="إغلاق">×</button>
</div>

<script type="module">
import { PERFUMES, TIERS, FAMILY, icon, EASE, reducedMotion } from './_data.js';
import { BottleGL } from './bottle-gl.js';

const $ = (s) => document.querySelector(s);
const cards = $('#cards'), stage = $('#stage'), scene = $('#scene'), panel = $('#panel');
const mist = $('#mist'), mistCtx = mist.getContext('2d');
const hint = document.querySelector('.drag-hint');
const glass = new BottleGL($('#glass'));
const still = reducedMotion();

// ---------------------------------------------------------------- the cards
for (const p of PERFUMES) {
  const li = document.createElement('li');
  li.className = 'card';
  li.tabIndex = 0;
  li.innerHTML = `
    <figure><img src="${p.photo}" alt="زجاجة ${p.name} من ${p.house}"><span class="hint">اكشف العطر</span></figure>
    <div class="meta">
      <div><div class="house latin">${p.houseEn}</div><div class="name">${p.name}</div></div>
      <div class="price">${p.price} <span class="latin" style="font-size:9px">EGP</span></div>
    </div>`;
  const go = () => open(p, li.querySelector('img'));
  li.addEventListener('click', go);
  li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  cards.append(li);
}

// ---------------------------------------------------------------- tweening
const tweens = new Set();
const tween = (ms, ease, fn) => new Promise((done) => {
  const start = performance.now();
  tweens.add({ start, ms: still ? 1 : ms, ease, fn, done });
});
const runTweens = (now) => {
  for (const t of tweens) {
    const k = Math.min(1, (now - t.start) / t.ms);
    t.fn(t.ease(k));
    if (k >= 1) { tweens.delete(t); t.done(); }
  }
};
const lerp = (a, b, k) => a + (b - a) * k;

const wait = (ms) => new Promise((r) => setTimeout(r, still ? 0 : ms));
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

// ---------------------------------------------------------------- state
let current = null, opening = false, phase = 'closed';
let chips = [];
// 0 while the object is still the photograph (no tilt, no bob); 1 once it stands.
let settle = 0;
let nozzle = { x: 0, y: 0 };

// The middle of the room the panel leaves free, in viewport pixels.
function restX() {
  const s = scene.getBoundingClientRect(), p = panel.getBoundingClientRect();
  const panelOnRight = p.left + p.width / 2 > s.left + s.width / 2;
  return panelOnRight ? (s.left + p.left) / 2 : (p.right + s.right) / 2;
}
const pointer = { x: 0, y: 0, active: false };
const look = { rx: 0, ry: 0, light: [0.35, 0.55, 1] };

scene.addEventListener('pointermove', (e) => {
  const r = scene.getBoundingClientRect();
  pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; pointer.active = true;
});
// Where the bottle stood on screen last frame: the pointer is read against it.
let held = { x: innerWidth * 0.36, y: innerHeight * 0.45 };
scene.addEventListener('pointerleave', () => { pointer.active = false; });

// ---------------------------------------------------------------- open
async function open(p, img) {
  if (opening || phase !== 'closed') return;
  opening = true; current = p;
  stage.style.setProperty('--mist', FAMILY[p.family].mist);
  renderPanel(p);
  stage.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  requestAnimationFrame(() => stage.classList.add('open'));
  glass.state.opacity = 0;
  const loaded = glass.load(p.cutout, p.height);

  // 1. The photograph flies from its card to the middle of the room…
  const from = img.getBoundingClientRect();
  const sr = scene.getBoundingClientRect();
  const h = sr.height * 0.62, w = h * 0.8;
  const to = { left: restX() - w / 2, top: sr.top + sr.height * 0.45 - h / 2, width: w, height: h };
  const flier = document.createElement('img');
  flier.className = 'flier'; flier.src = p.photo; flier.alt = '';
  Object.assign(flier.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px` });
  stage.append(flier);
  img.style.visibility = 'hidden';
  current.cardImg = img;
  await tween(760, EASE.entrance, (k) => {
    flier.style.left = `${lerp(from.left, to.left, k)}px`; flier.style.top = `${lerp(from.top, to.top, k)}px`;
    flier.style.width = `${lerp(from.width, to.width, k)}px`; flier.style.height = `${lerp(from.height, to.height, k)}px`;
  });
  await loaded;

  // 2. …the object is laid exactly over the bottle in the picture — flat, and
  // in the photograph's own light, so the two cannot be told apart — and the
  // picture dissolves around it, leaving the bottle in the dark room.
  const over = glass.poseOver(to, p.placement);
  Object.assign(glass.state, over, { opacity: 1, relight: 0, depth: 0, reflect: 0 });
  settle = 0; phase = 'rising';
  await nextFrame();
  const dissolve = tween(650, EASE.inOut, (k) => { flier.style.opacity = String(1 - k); flier.style.filter = `blur(${k * 10}px)`; }).then(() => flier.remove());
  await wait(240);

  // 3. Then it stands up out of it: upright, its faces standing out of the
  // flat picture, the room's light finding the glass, its reflection last.
  const stand = glass.poseStanding(restX());
  await tween(1300, EASE.inOut, (k) => {
    glass.state.x = lerp(over.x, stand.x, k); glass.state.y = lerp(over.y, stand.y, k);
    glass.state.scale = lerp(over.scale, stand.scale, k); glass.state.rz = lerp(over.rz, 0, k);
    glass.state.depth = Math.min(1, k * 1.5); glass.state.relight = k;
    glass.state.reflect = Math.max(0, (k - 0.55) / 0.45);
    settle = k;
  });
  await dissolve;
  stage.classList.add('revealed');
  phase = 'open'; opening = false;
  $('#close').focus({ preventScroll: true });
  if (!still) emitNotes(p); else placeNotesStill(p);
}

// ---------------------------------------------------------------- close
async function close() {
  if (phase !== 'open') return;
  phase = 'closing';
  stage.classList.remove('revealed');
  // The notes go back into the nozzle…
  await Promise.all(chips.map((c) => tween(420, EASE.inOut, (k) => { c.recall = k; })));
  chips.forEach((c) => c.el.remove()); chips = [];
  document.querySelectorAll('.tier-guide').forEach((g) => g.classList.remove('on'));

  // …and the bottle goes back into its photograph as the room's lights come up:
  // lying down again at the angle it was photographed, flattening, its light
  // becoming the photograph's own.
  const img = current.cardImg;
  const s = glass.state, from = { x: s.x, y: s.y, scale: s.scale, rz: s.rz };
  const into = glass.poseOver(img.getBoundingClientRect(), current.placement);
  stage.classList.remove('open');
  await tween(950, EASE.inOut, (k) => {
    s.x = lerp(from.x, into.x, k); s.y = lerp(from.y, into.y, k);
    s.scale = lerp(from.scale, into.scale, k); s.rz = lerp(from.rz, into.rz, k);
    s.relight = 1 - k; s.depth = Math.max(0, 1 - k * 1.4); s.reflect = Math.max(0, 1 - k * 2.5);
    settle = 1 - k;
  });
  // The picture returns under it, and the object is gone into the picture.
  img.style.opacity = '0'; img.style.visibility = '';
  await tween(240, EASE.inOut, (k) => { img.style.opacity = String(k); });
  await tween(180, EASE.inOut, (k) => { s.opacity = 1 - k; });
  img.style.opacity = '';
  stage.hidden = true;
  motes.length = 0;
  document.documentElement.style.overflow = '';
  phase = 'closed';
  img.closest('.card').focus({ preventScroll: true });
}
$('#close').addEventListener('click', close);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

// ---------------------------------------------------------------- panel
function renderPanel(p) {
  const f = FAMILY[p.family];
  const meter = (on, of = 4) => `<span class="meter">${Array.from({ length: of }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</span>`;
  panel.innerHTML = `
    <span class="kicker">${p.houseEn} · EST. ${p.founded}</span>
    <h2 class="display" id="stage-name">${p.name}</h2>
    <div class="en-name">${p.nameEn}</div>
    <dl>
      <dt>العائلة</dt><dd><span class="family-dot"></span>${f.ar}</dd>
      <dt>التركيز</dt><dd>${p.concentration} · ${p.ml} مل</dd>
      <dt>الثبات</dt><dd>${meter(p.longevity.segments)}${p.longevity.ar}</dd>
      <dt>الانتشار</dt><dd>${meter(p.projection.segments)}${p.projection.ar}</dd>
      <dt>الدار</dt><dd>${p.house} · ${p.city}</dd>
    </dl>
    <div class="price">${p.price}<small>EGP</small></div>
    <button class="buy" type="button">أضف إلى الحقيبة</button>`;
}

// ---------------------------------------------------------------- the notes
const RING = { top: { v: -0.16, r: 1.42, speed: 0.10 }, heart: { v: 0.42, r: 1.16, speed: -0.075 }, base: { v: 0.86, r: 0.98, speed: 0.06 } };
function makeChip(note, tier, i, n) {
  const el = document.createElement('span');
  el.className = 'note-chip';
  el.innerHTML = `${icon(note.icon)}<span>${note.ar}</span><span class="en">${note.en}</span>`;
  el.style.opacity = '0';
  $('#notes-front').append(el);
  return { el, tier, angle0: (i / n) * Math.PI * 2 + (tier === 'heart' ? 0.5 : tier === 'base' ? 1.1 : 0), born: Infinity, recall: 0 };
}
function emitNotes(p) {
  const order = ['top', 'heart', 'base'];
  let delay = 250;
  for (const tier of order) {
    const list = p.notes[tier];
    list.forEach((note, i) => {
      const chip = makeChip(note, tier, i, list.length);
      chip.born = performance.now() + delay + i * 170;
      chips.push(chip);
    });
    const guide = document.querySelector(`.tier-guide[data-tier="${tier}"]`);
    // Each tier is released with a spritz from the nozzle.
    setTimeout(() => burst(22), delay - 60);
    setTimeout(() => guide.classList.add('on'), delay + 300);
    delay += 900;
  }
}
function placeNotesStill(p) {
  for (const tier of ['top', 'heart', 'base']) {
    p.notes[tier].forEach((note, i, list) => { const c = makeChip(note, tier, i, list.length); c.born = 0; chips.push(c); });
    document.querySelector(`.tier-guide[data-tier="${tier}"]`).classList.add('on');
  }
}

// ---------------------------------------------------------------- mist
const sprite = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  return c;
})();
let spriteColour = '';
function paintSprite(colour) {
  if (colour === spriteColour) return;
  spriteColour = colour;
  const g = sprite.getContext('2d');
  g.clearRect(0, 0, 64, 64);
  const [r, gr, b] = [1, 3, 5].map((i) => parseInt(colour.slice(i, i + 2), 16));
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  // A soft shoulder rather than a cone, so neighbouring motes merge into one haze.
  grad.addColorStop(0, `rgba(${r},${gr},${b},1)`);
  grad.addColorStop(0.35, `rgba(${r},${gr},${b},0.55)`);
  grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
}
const motes = [];
let spawnDebt = 0;
function burst(n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
    const v = 60 + Math.random() * 90;
    motes.push({ x: nozzle.x, y: nozzle.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 6 + Math.random() * 6, life: 0, max: 1.6 + Math.random() * 1.2, seed: Math.random() * 10, peak: 0.2, grow: 64 });
  }
}
function stepMist(dt, at, t) {
  const ratio = 0.5;
  if (mist.width !== Math.round(mist.clientWidth * ratio)) { mist.width = Math.round(mist.clientWidth * ratio); mist.height = Math.round(mist.clientHeight * ratio); }
  mistCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  mistCtx.clearRect(0, 0, mist.clientWidth, mist.clientHeight);
  if (phase === 'open' && !still) {
    // A steady 40 motes a second, whatever the frame rate.
    spawnDebt += 30 * dt;
    while (spawnDebt >= 1) {
      spawnDebt -= 1;
      motes.push({ x: at.x + (Math.random() - 0.5) * 6, y: at.y, vx: (Math.random() - 0.5) * 10, vy: -(34 + Math.random() * 30), r: 4 + Math.random() * 4, life: 0, max: 4.2 + Math.random() * 2.4, seed: Math.random() * 10, peak: 0.13, grow: 70 });
    }
  }
  paintSprite(getComputedStyle(stage).getPropertyValue('--mist').trim() || '#F0B35E');
  // Screen, not add: overlapping motes deepen the colour without burning to white.
  mistCtx.globalCompositeOperation = 'screen';
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.life += dt;
    if (m.life > m.max) { motes.splice(i, 1); continue; }
    // The air it rises through sways it, more the higher it goes, as smoke.
    const sway = Math.sin((at.y - m.y) * 0.018 + t * 0.7 + m.seed) * Math.min(1, m.life / 1.5);
    m.vx += sway * 26 * dt;
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.vx *= Math.pow(0.6, dt); m.vy *= Math.pow(0.86, dt);
    const k = m.life / m.max;
    const r = m.r + k * m.grow;
    mistCtx.globalAlpha = m.peak * Math.sin(Math.PI * k);
    mistCtx.drawImage(sprite, m.x - r, m.y - r, r * 2, r * 2);
  }
  mistCtx.globalAlpha = 1;
}

// ---------------------------------------------------------------- the frame
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  runTweens(now);
  if (!stage.hidden && glass.count) {
    // Look: turn toward the pointer, read against the bottle; drift when it is away.
    const dx = (pointer.x - held.x) / innerWidth, dy = (pointer.y - held.y) / innerHeight;
    const tx = pointer.active ? Math.max(-0.42, Math.min(0.42, dx * 0.9)) : Math.sin(t * 0.35) * 0.12;
    const ty = pointer.active ? Math.max(-0.16, Math.min(0.16, dy * 0.45)) : Math.sin(t * 0.27) * 0.04;
    look.ry += (tx - look.ry) * Math.min(1, dt * 3.2);
    look.rx += (ty - look.rx) * Math.min(1, dt * 3.2);
    // The light comes from where the pointer is, around the bottle — and never
    // from straight ahead, which would whiten the flat faces of the glass the
    // way no studio light does. Only its direction follows the pointer; it is
    // always at least ~38 degrees off the face, so the bevels catch it.
    let lx = pointer.active ? dx * 3.2 : Math.sin(t * 0.35) * 0.9;
    let ly = pointer.active ? -dy * 3.2 : 0.62;
    const m = Math.hypot(lx, ly), want = Math.min(1.6, Math.max(0.8, m));
    if (m > 1e-3) { lx *= want / m; ly *= want / m; } else { [lx, ly] = look.light; }
    look.light[0] += (lx - look.light[0]) * Math.min(1, dt * 4);
    look.light[1] += (ly - look.light[1]) * Math.min(1, dt * 4);
    if (phase === 'open') glass.state.x = glass.poseStanding(restX()).x;
    Object.assign(glass.state, {
      ry: still ? 0 : look.ry * settle, rx: still ? 0 : look.rx * settle,
      lift: still ? 0 : Math.sin(t * 1.1) * 0.012 * settle,
      light: look.light,
      sweep: still ? -1 : ((t % 6) / 6) * 2.6 - 0.7,
      tint: [1, 0.97, 0.92],
    });
    glass.render();

    // Where the bottle is on screen this frame.
    const top = glass.project(0.5, 0.0), foot = glass.project(0.5, 1.0);
    const left = glass.project(0, 0.5), right = glass.project(1, 0.5);
    const width = Math.abs(right.x - left.x), height = foot.y - top.y;
    const cx = (left.x + right.x) / 2;
    held = { x: cx, y: (top.y + foot.y) / 2 };
    const plinth = document.getElementById('plinth');
    Object.assign(plinth.style, { left: `${cx}px`, top: `${foot.y + 6}px`, width: `${width * 2.4}px`, height: `${width * 0.5}px` });
    nozzle = { x: top.x, y: top.y + 4 };
    stepMist(dt, nozzle, t);
    hint.style.transform = `translateX(${cx}px) translateX(-50%)`;

    // The notes: from the nozzle, rising, to their ring; then the slow orbit.
    for (const c of chips) {
      const ring = RING[c.tier];
      const age = (now - c.born) / 1000;
      if (age < 0) continue;
      const birth = still ? 1 : EASE.out(Math.min(1, age / 1.25));
      const angle = c.angle0 + (still ? 0 : t * ring.speed * Math.PI * 2 * 0.25);
      const rx = width * 0.5 * ring.r + 90, ry = rx * 0.17;
      const ringY = top.y + height * ring.v;
      const depth = Math.sin(angle);
      let x = cx + Math.cos(angle) * rx, y = ringY + depth * ry;
      // Emerging: a rising arc out of the nozzle.
      x = lerp(top.x, x, birth); y = lerp(top.y, y, birth) - Math.sin(Math.PI * birth) * 48;
      // Recalled on close: back into the nozzle.
      x = lerp(x, top.x, c.recall); y = lerp(y, top.y, c.recall);
      const front = depth > -0.05;
      const parent = front ? 'notes-front' : 'notes-back';
      if (c.el.parentElement.id !== parent) document.getElementById(parent).append(c.el);
      const s = 0.8 + 0.2 * (depth + 1) / 2;
      c.el.style.opacity = String(birth * (1 - c.recall) * (0.5 + 0.5 * (depth + 1) / 2));
      c.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s * (0.6 + 0.4 * birth)})`;
    }
    // The tier guides sit at their ring's height.
    for (const g of document.querySelectorAll('.tier-guide')) {
      g.style.top = `${top.y + height * RING[g.dataset.tier].v - 8}px`;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// For screenshots: ?open=<slug>
const wanted = new URLSearchParams(location.search).get('open');
if (wanted) {
  const index = PERFUMES.findIndex((p) => p.slug === wanted);
  if (index >= 0) setTimeout(() => cards.children[index].click(), 600);
}
</script>
