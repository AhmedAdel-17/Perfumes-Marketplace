<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header 03 · Pyramide</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
/*
  03 · PYRAMIDE — every perfume is told in three tiers: the TOP notes you meet
  first, the HEART that stays, the BASE that lasts. The masthead is built the
  same way, and arrives in that order: the top tier (preferences) appears,
  then the heart (the house, centred, its rules drawing outward like a scent
  opening up), then the base (the ways in). Scroll, and it dries down: the
  top evaporates first, as top notes do, and the heart condenses.
*/
.mast { position: sticky; top: 0; z-index: 40; background: var(--ground); border-bottom: 1px solid var(--ink); }
.tier { position: relative; }

/* TOP — preferences, lightest, first to arrive and first to go. */
.top { border-bottom: 1px solid var(--line); max-height: 48px; overflow: hidden; animation: unfold 900ms var(--entrance) .1s both; transition: max-height var(--slow) var(--out), opacity var(--base) var(--out), border-color var(--base); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.top .descriptor { font-family: var(--f-label); font-size: 9.5px; letter-spacing: 3.2px; color: var(--ink3); }
[data-scrolled] .top { max-height: 0; opacity: 0; border-color: transparent; }

/* HEART — the house. */
.heart .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; height: 96px; transition: height var(--slow) var(--out); }
[data-scrolled] .heart .wrap { height: 62px; }
.heart .rule { height: 1px; background: var(--ink); transform: scaleX(0); animation: open 1.4s var(--out) .55s forwards; }
.heart .rule.a { transform-origin: var(--edge-end); }   /* both rules grow OUTWARD from the mark */
.heart .rule.b { transform-origin: var(--edge-start); }
.mark { display: flex; align-items: center; gap: 16px; animation: unfold 1s var(--entrance) .35s both; }
.mark svg { width: 38px; height: 38px; color: var(--ink); transition: width var(--slow) var(--out), height var(--slow) var(--out), color var(--slow) var(--out), transform 1.2s var(--entrance); }
.mark:hover svg { color: var(--accent); transform: rotate(90deg); }
.wordmark { font-family: var(--f-wordmark); font-size: 36px; letter-spacing: .34em; margin-inline-end: -.34em; direction: ltr; line-height: 1; transition: font-size var(--slow) var(--out), letter-spacing var(--slow) var(--out); }
[data-scrolled] .mark svg { width: 28px; height: 28px; }
[data-scrolled] .wordmark { font-size: 24px; letter-spacing: .28em; }

/* BASE — the ways in, last to arrive, the one that stays. */
.base { animation: unfold 900ms var(--entrance) .75s both; }
.base nav ul { display: flex; justify-content: center; align-items: center; height: 52px; list-style: none; transition: height var(--slow) var(--out); }
[data-scrolled] .base nav ul { height: 44px; }
.base nav li { display: flex; align-items: center; }
.base nav li + li::before { /* the diamond between ways in — the monogram's own shape */
  content: ''; width: 5px; height: 5px; margin-inline: 34px; border: 1px solid var(--ink3); transform: rotate(45deg);
  transition: background var(--base) var(--out), border-color var(--base) var(--out);
}
.base nav a { position: relative; font-size: 15px; color: var(--ink2); padding-block: 12px; transition: color var(--base) var(--out); }
.base nav a::after { content: ''; position: absolute; inset-inline: 0; bottom: 8px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: var(--edge-end); transition: transform var(--base) var(--out); }
.base nav a:hover, .base nav a[aria-current] { color: var(--ink); }
.base nav a:hover::after, .base nav a[aria-current]::after { transform: scaleX(1); transform-origin: var(--edge-start); }
.base nav li:has(a:hover)::before, .base nav li:has(a:hover) + li::before { background: var(--accent); border-color: var(--accent); }

@keyframes unfold { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes open { to { transform: scaleX(1); } }
</style>
</head>
<body>
<header class="mast">
  <div class="tier top">
    <div class="wrap">
      <span class="descriptor" lang="en">EGYPTIAN PERFUME HOUSES</span>
      <div class="prefs">
        <div class="lang" role="group" aria-label="اللغة"><span aria-current="true">AR</span><a href="#" hreflang="en">EN</a><span class="bar"></span></div>
        <button class="theme" data-toggle-theme aria-label="الوضع الداكن">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 16.5a4.5 4.5 0 100-9 4.5 4.5 0 000 9z"/><path d="M12 3.5v1.6M12 18.9v1.6M4.5 12H6.1M17.9 12h1.6"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M19.5 14.6A7.5 7.5 0 019.4 4.5a7.5 7.5 0 1010.1 10.1z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="tier heart">
    <div class="wrap">
      <span class="rule a" aria-hidden="true"></span>
      <a class="mark" href="#" aria-label="ديار — الصفحة الرئيسية">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 2 46 24 24 46 2 24 Z" stroke="currentColor" stroke-opacity=".55" stroke-width="1.15"/><path d="M16.5 33.5 V23.4 Q16.5 17.4 24 12.6 Q31.5 17.4 31.5 23.4 V33.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/><path d="M19.4 33.5 H28.6" stroke="currentColor" stroke-opacity=".7" stroke-width="1.5"/><circle cx="24" cy="20.4" r="1.35" fill="currentColor" fill-opacity=".85"/></svg>
        <span class="wordmark">DIYAR</span>
      </a>
      <span class="rule b" aria-hidden="true"></span>
    </div>
  </div>
  <div class="tier base">
    <nav aria-label="التصفّح"><ul>
      <li><a href="#" aria-current="page">العطور</a></li>
      <li><a href="#">الدور</a></li>
      <li><a href="#">تتبّع طلبك</a></li>
    </ul></nav>
  </div>
</header>
<div data-sentinel style="position:absolute;top:24px;height:1px;width:1px"></div>

<main class="wrap">
  <section class="hero">
    <div>
      <span class="kicker">NO. 01 — THE REGISTER OF HOUSES</span>
      <h1>كل عطر،<em>ومعه مصدره.</em></h1>
      <p>نسجّل كل دار عطور مصرية، ونصف كل عطر بالطريقة نفسها: نفحاته، وتركيزه، ومن قاس ثباته.</p>
    </div>
    <figure><figcaption><span>DAR AL WARD</span><span>SPECIMEN</span></figcaption><img src="../../../apps/web/scripts/mock-photos/ward-al-taif.jpg" alt=""></figure>
  </section>
  <div class="filler"></div>
</main>
<div class="note">03 · PYRAMIDE — reload to see it unfold · scroll · hover the links and the mark</div>

</body>
</html>
