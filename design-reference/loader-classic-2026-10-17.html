<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Loader · classic flacons · 17 Oct 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
  /* "Le Rituel" redrawn as CLASSIC flacons, at the founder's request: short,
     rounded, dressing-table bottles. A — Poire: a squat round bottle with a
     squeeze-bulb atomiser and tassel. B — Cristal: a faceted crystal flacon
     with a tall stopper. Both fill while waiting and mark "done" once. */
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .theme { padding: 36px 48px 48px; }
  .light { --ground:#E7E2D8; --raised:#F4F1EB; --line:#CEC6B8; --ink:#221F1B; --ink2:#5A554D; --ink3:#67615A; --accent:#4D5A2C; }
  .dark { --ground:#201E1C; --raised:#2A2725; --line:#4E4844; --ink:#F8F3EB; --ink2:#CDC5BA; --ink3:#B1A89C; --accent:#EDA53E; }
  .theme { background: var(--ground); color: var(--ink); }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 2.4px; color: var(--accent); margin-bottom: 8px; }
  h2 { font-family: 'Noto Naskh Arabic', serif; font-weight: 500; font-size: 24px; margin-bottom: 18px; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .stage { border: 1px solid var(--line); background: var(--raised); min-height: 260px; display: grid; place-items: center; position: relative; }
  .page { background: var(--ground); }
  .label { position: absolute; bottom: 10px; inset-inline-start: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 2px; color: var(--ink3); }
  .center { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .caption { font-size: 13px; color: var(--ink3); }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding-inline: 22px; background: var(--ink); color: var(--ground); font-size: 15px; font-weight: 500; }

  svg.f { overflow: visible; color: var(--ink); }
  svg.f.lg { width: 170px; height: 151px; } svg.f.md { width: 81px; height: 72px; } svg.f.sm { width: 27px; height: 24px; color: currentColor; }
  .line { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .thin { fill: none; stroke: currentColor; stroke-width: .8; opacity: .45; vector-effect: non-scaling-stroke; }
  .metal { fill: var(--accent); }
  .label-oval { fill: var(--raised); stroke: currentColor; stroke-width: .9; vector-effect: non-scaling-stroke; }
  .page .label-oval { fill: var(--ground); }
  .nozzle { fill: currentColor; }
  .sm .label-oval, .sm .label-line { display: none; }
  .liquid { fill: var(--accent); opacity: .88; }
  .surface { fill: none; stroke: var(--ground); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; }
  .drop, .cloud circle { fill: var(--accent); }
  .sm .liquid { fill: currentColor; opacity: .55; } .sm .metal { fill: currentColor; } .sm .mist, .sm .thin, .sm .wisp { display: none; }

  .wave { animation: wave 1.6s linear infinite; }
  @keyframes wave { to { transform: translateX(-24px); } }
  .level { animation: fill 2.8s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes fill { 0% { transform: translateY(var(--empty)); } 62%, 100% { transform: translateY(var(--full)); } }
  /* Poire: the bulb squeezes, the mist leaves the nozzle — at the end of each fill. */
  .bulb { transform-box: fill-box; transform-origin: center top; animation: squeeze 2.8s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes squeeze { 0%, 66% { transform: none; } 72% { transform: scale(.78, .9); } 82%, 100% { transform: none; } }
  .drop { opacity: 0; animation: mist 2.8s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes mist { 0%, 70% { opacity: 0; transform: translate(0,0) scale(.4); } 74% { opacity: .95; } 96%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6); } }
  .cloud { opacity: 0; transform-box: fill-box; transform-origin: left center; animation: cloud 2.8s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes cloud { 0%, 70% { opacity: 0; transform: scale(.3); } 76% { opacity: 1; } 100% { opacity: 0; transform: scale(1.8); } }
  /* Cristal: the stopper lifts, a wisp of scent rises and curls away. */
  .stopper { animation: lift 2.8s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes lift { 0%, 64% { transform: none; } 72%, 88% { transform: translateY(-5px); } 96%, 100% { transform: none; } }
  .wisp { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 60; stroke-dashoffset: 60; opacity: 0; animation: wisp 2.8s cubic-bezier(.16,1,.3,1) infinite; }
  .wisp.b { animation-delay: .12s; }
  @keyframes wisp { 0%, 68% { stroke-dashoffset: 60; opacity: 0; } 74% { opacity: .9; } 92% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<script>
let n = 0;
const DROPS = [[16,-9,1.4],[21,-4,1],[24,1,1.3],[19,5,.9],[27,-7,.8],[30,-1,1.1],[26,6,.7],[13,-2,.8],[33,4,.6],[22,-11,.6],[35,-5,.5],[29,9,.5]];
// A — POIRE v2: a flattened round flacon on a pedestal foot, an oval label, a
// glass highlight, a gold collar and domed atomiser head, and a braided tube
// down to a pear-shaped bulb with a fringed tassel, hanging beside it.
const BODY = 'M45 37c13.4 0 22 6.6 22 16.2S58.4 69.5 45 69.5 23 62.8 23 53.2 31.6 37 45 37z';
const poire = (size) => { const id = 'p' + (n++); return `
<svg class="f ${size}" viewBox="0 0 90 80" aria-hidden="true">
  <defs><clipPath id="${id}"><path d="${BODY}"/></clipPath></defs>
  <g clip-path="url(#${id})"><g class="level" style="--empty:34px;--full:3px"><g class="wave">
    <path class="liquid" d="M0 37q6-3 12 0t12 0 12 0 12 0 12 0 12 0 12 0 12 0V95H0z"/>
    <path class="surface" d="M0 37q6-3 12 0t12 0 12 0 12 0 12 0 12 0 12 0 12 0"/></g></g></g>
  <path class="line" d="${BODY}"/>
  <path class="line" d="M37.5 69.2l-1.5 3.3h18l-1.5-3.3"/>
  <ellipse class="label-oval" cx="45" cy="54" rx="9" ry="5.6"/>
  <path class="thin label-line" d="M40.5 54h9"/>
  <path class="thin" d="M28.5 47.5c1.6-3.6 4.6-6 8.4-7.2"/>
  <rect class="line" x="41" y="31" width="8" height="6"/>
  <rect class="metal" x="38.5" y="28" width="13" height="3.2"/>
  <path class="line" d="M41.5 28v-2.6c0-2.2 1.6-3.6 3.5-3.6s3.5 1.4 3.5 3.6V28"/>
  <path class="line" d="M48.5 25.2h3.4"/>
  <circle class="nozzle" cx="45" cy="21" r=".9"/>
  ${size === 'sm' ? '' : `
  <path class="line tube" d="M41.5 25.6c-7 .2-13.5 2.4-17.5 7.6-2 2.6-3 5.4-3.2 8.2"/>
  <path class="thin" d="M38 25.8l.8 1.4M34 26.6l.8 1.4M30 28l.8 1.4M26.5 30.6l1 1.2M23.6 34.2l1.2 1"/>
  <g class="bulb"><path class="line" d="M21.3 41.4c-3.4.4-6.4 4-6.4 8.8 0 4.6 3 8.3 6.5 8.3s6.5-3.7 6.5-8.3c0-4.8-3.1-9.2-6.6-8.8z"/></g>
  <circle class="metal" cx="21.4" cy="59.6" r="1.3"/>
  <path class="thin tassel" d="M21.4 61v7M19.6 61.4l-1 6.6M23.2 61.4l1 6.6M18.4 61.2l-2 6M24.4 61.2l2 6"/>`}
  <g class="mist">
    <g class="cloud"><circle cx="61" cy="25.2" r="9" opacity=".08"/><circle cx="59.5" cy="25.2" r="5.8" opacity=".14"/><circle cx="58" cy="25.2" r="3.2" opacity=".22"/></g>
    ${DROPS.map(([dx,dy,r],i)=>`<circle class="drop" cx="52.4" cy="25.2" r="${r}" style="--dx:${dx}px;--dy:${dy}px;animation-delay:${(i%5)*.03}s"/>`).join('')}
  </g>
</svg>`; };
// B — CRISTAL: a squat faceted flacon (an octagon), a collar, a tall faceted stopper.
const cristal = (size) => { const id = 'c' + (n++); return `
<svg class="f ${size}" viewBox="0 0 80 80" aria-hidden="true">
  <defs><clipPath id="${id}"><path d="M30 36h20l9 9v14l-9 9H30l-9-9V45z"/></clipPath></defs>
  <g clip-path="url(#${id})"><g class="level" style="--empty:34px;--full:2px"><g class="wave">
    <path class="liquid" d="M0 36q6-3 12 0t12 0 12 0 12 0 12 0 12 0 12 0V90H0z"/>
    <path class="surface" d="M0 36q6-3 12 0t12 0 12 0 12 0 12 0 12 0 12 0"/></g></g></g>
  <path class="line" d="M30 36h20l9 9v14l-9 9H30l-9-9V45z"/>
  <path class="thin" d="M30 36l4 9h12l4-9M21 45h13M46 45h13M34 45v14M46 45v14M21 59h13M46 59h13M30 68l4-9h12l4 9"/>
  <rect class="metal" x="35" y="32" width="10" height="4"/>
  <g class="stopper">
    <path class="line" d="M37 32v-3h6v3"/>
    <path class="line" d="M40 13l7 7-7 9-7-9z"/>
    <path class="thin" d="M33 20h14M40 13v16"/>
  </g>
  <path class="wisp" d="M40 11c-4-4 3-6 0-10s4-6 1-9"/>
  <path class="wisp b" d="M43 12c3-3-1-6 2-9s-1-5 2-8"/>
</svg>`; };
for (const theme of ['light', 'dark']) {
  let html = `<section class="theme ${theme}">`;
  for (const [draw, tag, title] of [[poire, 'A — POIRE (v2)', 'القارورة الكلاسيكية بمِرذاذ الكُمّثرى']]) {
    html += `<div class="tag">${tag} · ${theme.toUpperCase()}</div><h2>${title}</h2>
    <div class="row">
      <div class="stage page"><div class="center">${draw('lg')}<span class="caption">لحظة…</span></div><span class="label">LARGE · A PAGE</span></div>
      <div class="stage"><div class="center">${draw('md')}<span class="caption">…جارٍ تحديث النتائج</span></div><span class="label">MEDIUM · A SECTION</span></div>
      <div class="stage"><span class="btn">${draw('sm')}<span>…جارٍ الإضافة</span></span><span class="label">SMALL · A BUTTON</span></div>
    </div>`;
  }
  document.body.insertAdjacentHTML('beforeend', html + '</section>');
}
</script>
</body>
</html>
