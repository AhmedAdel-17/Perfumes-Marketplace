<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader concepts · 17 Oct 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
  /*
    Loading-indicator concepts: a flacon that fills, a flacon that sprays, and
    the ritual that does both (fills while waiting, one spritz when done).
    Each shown LARGE (a page loading), MEDIUM (a section) and SMALL (a button).
    Real palettes; open in a browser to see them move.
  */
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .theme { padding: 40px 48px 56px; }
  .light { --ground:#E7E2D8; --raised:#F4F1EB; --line:#CEC6B8; --ink:#221F1B; --ink2:#5A554D; --ink3:#67615A; --accent:#4D5A2C; --on:#F4F1EB; }
  .dark { --ground:#201E1C; --raised:#2A2725; --line:#4E4844; --ink:#F8F3EB; --ink2:#CDC5BA; --ink3:#B1A89C; --accent:#EDA53E; --on:#201E1C; }
  .theme { background: var(--ground); color: var(--ink); }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 2.4px; color: var(--accent); display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .tag::after { content: ''; width: 48px; height: 1px; background: currentColor; }
  h2 { font-family: 'Noto Naskh Arabic', serif; font-weight: 500; font-size: 26px; margin-bottom: 4px; }
  .sub { color: var(--ink2); font-size: 14px; margin-bottom: 26px; max-width: 760px; line-height: 1.8; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; margin-bottom: 44px; }
  .stage { border: 1px solid var(--line); background: var(--raised); min-height: 280px; display: grid; place-items: center; position: relative; }
  .stage .label { position: absolute; top: 10px; inset-inline-start: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 2px; color: var(--ink3); }
  .page { background: var(--ground); }
  .page .bar { position: absolute; top: 0; inset-inline: 0; height: 44px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; font-family: 'Newsreader', serif; letter-spacing: .2em; font-size: 15px; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 30px; }
  .caption { font-size: 13px; color: var(--ink3); }
  .grid { display: grid; grid-template-columns: repeat(3, 56px); gap: 10px; opacity: .35; position: absolute; inset: 40px; align-content: start; }
  .grid i { display: block; height: 70px; border: 1px solid var(--line); }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding-inline: 22px; background: var(--ink); color: var(--ground); font-size: 15px; font-weight: 500; }
  .btns { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

  /* ---------------------------------------------------------- the flacon */
  .flacon { overflow: visible; }
  .flacon .glass { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
  .flacon .ticks { stroke: currentColor; stroke-width: .9; opacity: .55; vector-effect: non-scaling-stroke; }
  .flacon .cap { fill: none; stroke: currentColor; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .flacon .cap-line { stroke: currentColor; stroke-width: .8; opacity: .5; vector-effect: non-scaling-stroke; }
  .flacon .collar { fill: var(--accent); }
  .flacon .neck { fill: none; stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .flacon .nozzle { fill: currentColor; }
  .flacon .liquid { fill: var(--accent); opacity: .9; }
  .flacon .surface { fill: none; stroke: var(--ground); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; }
  .flacon .shine { fill: none; stroke: currentColor; stroke-width: .8; opacity: .25; vector-effect: non-scaling-stroke; }
  .flacon .cloud { opacity: 0; transform-box: fill-box; transform-origin: left center; }
  .lg { width: 96px; height: 150px; color: var(--ink); }
  .md { width: 44px; height: 69px; color: var(--ink); }
  .sm { width: 15px; height: 24px; color: currentColor; }
  .sm .mist, .sm .ticks, .sm .shine, .sm .cap-line { display: none; }
  .btn .sm .liquid { fill: currentColor; opacity: .6; }
  .btn .sm .collar { fill: currentColor; }

  /* 1 · FILLING: the level rises with a slow wave on its surface, then drains. */
  .fill .level { animation: level 3.2s cubic-bezier(.65,0,.35,1) infinite; }
  .fill .wave { animation: wave 1.6s linear infinite; }
  @keyframes level { 0% { transform: translateY(58px); } 55% { transform: translateY(6px); } 70% { transform: translateY(6px); } 100% { transform: translateY(58px); } }
  @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-28px); } }

  /* 2 · SPRAY: the cap presses, a fine mist leaves the nozzle and dissolves. */
  .spray .cap-g { animation: press 1.8s cubic-bezier(.65,0,.35,1) infinite; }
  .spray .drop { animation: mist 1.8s cubic-bezier(.16,1,.3,1) infinite; opacity: 0; }
  .spray .drop:nth-child(2) { animation-delay: .05s } .spray .drop:nth-child(3) { animation-delay: .1s }
  .spray .drop:nth-child(4) { animation-delay: .07s } .spray .drop:nth-child(5) { animation-delay: .13s }
  .spray .drop:nth-child(6) { animation-delay: .02s } .spray .drop:nth-child(7) { animation-delay: .16s }
  .spray .drop:nth-child(8) { animation-delay: .09s }
  @keyframes press { 0%, 12% { transform: none; } 18% { transform: translateY(2px); } 30%, 100% { transform: none; } }
  @keyframes mist {
    0%, 16% { opacity: 0; transform: translate(0, 0) scale(.4); }
    22% { opacity: .95; }
    70% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6); }
  }

  /* 3 · THE RITUAL: fills while waiting; when the page is ready, one spritz. */
  .ritual .level { animation: level-up 2.4s cubic-bezier(.65,0,.35,1) infinite; }
  .ritual .wave { animation: wave 1.6s linear infinite; }
  .ritual .cap-g { animation: press-once 2.4s cubic-bezier(.65,0,.35,1) infinite; }
  .ritual .drop { animation: mist-once 2.4s cubic-bezier(.16,1,.3,1) infinite; opacity: 0; }
  .ritual .drop:nth-child(2) { animation-delay: .04s } .ritual .drop:nth-child(3) { animation-delay: .08s }
  .ritual .drop:nth-child(4) { animation-delay: .06s } .ritual .drop:nth-child(5) { animation-delay: .1s }
  .ritual .drop:nth-child(6) { animation-delay: .02s } .ritual .drop:nth-child(7) { animation-delay: .12s }
  .ritual .drop:nth-child(8) { animation-delay: .07s }
  @keyframes level-up { 0% { transform: translateY(58px); } 70%, 100% { transform: translateY(8px); } }
  @keyframes press-once { 0%, 72% { transform: none; } 76% { transform: translateY(2px); } 84%, 100% { transform: none; } }
  @keyframes mist-once {
    0%, 74% { opacity: 0; transform: translate(0, 0) scale(.4); }
    78% { opacity: .95; }
    96% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6); }
    100% { opacity: 0; }
  }

    .spray .cloud { animation: cloud 1.8s cubic-bezier(.16,1,.3,1) infinite; }
  .ritual .cloud { animation: cloud-once 2.4s cubic-bezier(.16,1,.3,1) infinite; }
  @keyframes cloud { 0%, 16% { opacity: 0; transform: scale(.3); } 26% { opacity: .35; } 80%, 100% { opacity: 0; transform: scale(1.8); } }
  @keyframes cloud-once { 0%, 74% { opacity: 0; transform: scale(.3); } 80% { opacity: .35; } 100% { opacity: 0; transform: scale(1.8); } }
  .spray .level { transform: translateY(26px); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .level { transform: translateY(26px); } }
</style>
</head>
<body>
<template id="flacon">
  <svg class="flacon" viewBox="0 0 64 100" aria-hidden="true">
    <defs>
      <clipPath id="CLIP"><path d="M15.6 33.4 23.4 27.6h17.2l7.8 5.8v57.2H15.6z"/></clipPath>
      <filter id="FCLIP" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <g clip-path="url(#CLIP)">
      <g class="level">
        <g class="wave">
          <path class="liquid" d="M0 30 q7 -3.5 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 V110 H0z"/>
          <path class="surface" d="M0 30 q7 -3.5 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
        </g>
      </g>
    </g>
    <path class="glass" d="M14.5 33 23 26.5h18l8.5 6.5v58.5h-35z"/>
    <path class="ticks" d="M43 44h3M43 54h3M43 64h3M43 74h3M43 84h3M44.5 49h1.5M44.5 59h1.5M44.5 69h1.5M44.5 79h1.5"/>
    <path class="shine" d="M19 38v44"/>
    <g class="cap-g">
      <rect class="cap" x="24" y="4" width="16" height="13"/>
      <path class="cap-line" d="M24 8.5h16"/>
      <rect class="collar" x="27" y="17" width="10" height="3"/>
      <rect class="neck" x="29" y="20" width="6" height="6.5"/>
      <circle cx="40.5" cy="10.5" r="1" class="nozzle"/>
    </g>
    <g class="mist">
      <ellipse class="cloud" cx="52" cy="10" rx="9" ry="6" fill="var(--accent)" filter="url(#FCLIP)"/>
      <circle class="drop" cx="40.5" cy="10" r="1.5" fill="var(--accent)" style="--dx:16px;--dy:-9px"/><circle class="drop" cx="40.5" cy="10" r="1.1" fill="var(--accent)" style="--dx:21px;--dy:-4px"/><circle class="drop" cx="40.5" cy="10" r="1.4" fill="var(--accent)" style="--dx:24px;--dy:1px"/><circle class="drop" cx="40.5" cy="10" r="1.0" fill="var(--accent)" style="--dx:19px;--dy:5px"/><circle class="drop" cx="40.5" cy="10" r="0.9" fill="var(--accent)" style="--dx:27px;--dy:-7px"/><circle class="drop" cx="40.5" cy="10" r="1.2" fill="var(--accent)" style="--dx:30px;--dy:-1px"/><circle class="drop" cx="40.5" cy="10" r="0.8" fill="var(--accent)" style="--dx:26px;--dy:6px"/><circle class="drop" cx="40.5" cy="10" r="0.9" fill="var(--accent)" style="--dx:13px;--dy:-2px"/><circle class="drop" cx="40.5" cy="10" r="0.7" fill="var(--accent)" style="--dx:33px;--dy:4px"/><circle class="drop" cx="40.5" cy="10" r="0.7" fill="var(--accent)" style="--dx:22px;--dy:-11px"/><circle class="drop" cx="40.5" cy="10" r="0.6" fill="var(--accent)" style="--dx:35px;--dy:-5px"/><circle class="drop" cx="40.5" cy="10" r="0.6" fill="var(--accent)" style="--dx:29px;--dy:9px"/><circle class="drop" cx="40.5" cy="10" r="0.7" fill="var(--accent)" style="--dx:17px;--dy:9px"/><circle class="drop" cx="40.5" cy="10" r="0.5" fill="var(--accent)" style="--dx:38px;--dy:1px"/>
    </g>
  </svg>
</template>
<script>
  let n = 0;
  const bottle = (kind, size) => {
    const t = document.getElementById('flacon').innerHTML.replaceAll('CLIP', 'c' + (n++));
    return t.replace('class="flacon"', `class="flacon ${kind} ${size}"`).replace(kind === 'fill' ? '<g class="mist">' : '§', kind === 'fill' ? '<g class="mist" style="display:none">' : '§');
  };
  const CONCEPTS = [
    ['fill', 'CONCEPT 01 — REMPLISSAGE', 'القارورة تمتلئ', 'السائل يرتفع بموجة هادئة على سطحه ثم يعود، ما دام التحميل مستمرًا. الأهدأ والأوضح.'],
    ['spray', 'CONCEPT 02 — VAPORISATION', 'القارورة ترشّ', 'الغطاء يُضغط، ورذاذ ناعم يخرج من الفوّهة ويتلاشى، كل ثانيتين تقريبًا. الأكثر حيوية، ويتّسق مع رذاذ الشعار في الأعلى.'],
    ['ritual', 'CONCEPT 03 — LE RITUEL (RECOMMENDED)', 'تمتلئ أثناء الانتظار، وترشّ عند الاكتمال', 'الامتلاء يعني «لحظة»، والرشّة الواحدة تعني «جاهز». في الموقع الحقيقي تُرشّ مرة واحدة فقط عند انتهاء التحميل، وهنا تتكرر لتراها.'],
  ];
  for (const theme of ['light', 'dark']) {
    let html = `<section class="theme ${theme}">`;
    for (const [kind, tag, title, sub] of CONCEPTS) {
      html += `<div class="tag">${tag} · ${theme.toUpperCase()}</div><h2>${title}</h2><p class="sub">${sub}</p>
      <div class="row">
        <div class="stage page"><div class="bar"><span>DIYAR</span><span style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:2px">AR | EN</span></div>
          <div class="center">${bottle(kind, 'lg')}<span class="caption">لحظة…</span></div>
          <span class="label" style="top:auto;bottom:10px">LARGE · A PAGE LOADING</span></div>
        <div class="stage"><div class="center" style="margin-top:0">${bottle(kind, 'md')}<span class="caption">…جارٍ تحديث النتائج</span></div><span class="label">MEDIUM · A SECTION</span></div>
        <div class="stage"><div class="btns">
          <span class="btn">${bottle(kind, 'sm')}<span>…جارٍ الإضافة</span></span>
          <span class="btn ghost">${bottle(kind, 'sm')}<span>…جارٍ الحفظ</span></span>
        </div><span class="label">SMALL · A BUTTON</span></div>
      </div>`;
    }
    document.body.insertAdjacentHTML('beforeend', html + '</section>');
  }
</script>
</body>
</html>
