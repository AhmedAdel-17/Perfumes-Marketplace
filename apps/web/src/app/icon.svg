<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ديار">
  <!--
    The tab icon.

    There was none: no `public/`, no icon file, no `icons` in the layout's
    metadata — so every tab showed a blank square and every page load spent a
    request on `/favicon.ico` and got a 404. Next serves this file at /icon and
    injects the <link>, which also stops that probe.

    A FLACON, not a letter. At 16px an Arabic wordmark is illegible and a Latin
    one says nothing about what the site sells; a bottle silhouette survives the
    size.

    Identity v2 (Phase D, 16 Oct 2026): Laboratoire's own pair — a sepia
    bottle on putty, its liquid in the one accent, olive — replacing the first
    identity's metallic-on-black. Square, because the identity has no rounded
    corners. The values are `tokens.json`'s colorLight.putty, .sepia and .olive,
    written as literals because an SVG cannot read a token; this file is outside
    the drift guard's source set for exactly that reason.
  -->
  <rect width="32" height="32" fill="#E7E2D8"/>
  <!-- cap -->
  <rect x="13" y="5" width="6" height="4" fill="#221F1B"/>
  <!-- neck -->
  <rect x="14.5" y="9" width="3" height="3" fill="#221F1B"/>
  <!-- body: shoulders, then a straight-sided flask -->
  <path
    d="M12 12.5c0-.6.5-.5 1-.9h6c.5.4 1 .3 1 .9 1.6 1.2 2.4 2.8 2.4 4.8v6.4c0 1.7-1.1 2.8-2.8 2.8h-7.2c-1.7 0-2.8-1.1-2.8-2.8v-6.4c0-2 .8-3.6 2.4-4.8Z"
    fill="#221F1B"
  />
  <!-- the liquid: the accent, below the line -->
  <path
    d="M9.6 18.4h12.8v5.4c0 1.7-1.1 2.8-2.8 2.8h-7.2c-1.7 0-2.8-1.1-2.8-2.8v-5.4Z"
    fill="#4D5A2C"
  />
</svg>
