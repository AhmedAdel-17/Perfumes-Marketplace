name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No `version:` here ON PURPOSE. package.json pins
      # `packageManager: pnpm@11.25.0`, and the action refuses to start when a
      # version is declared in both places rather than picking one — the first
      # CI run on `main` (20 Sep 2026) failed here before installing anything.
      # Deleting the looser of the two declarations leaves the exact version
      # developers run, which is the stricter pin and the one a lockfile is
      # written against.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Strict TypeScript across every package. `any` and @ts-ignore are banned
      # by ENGINEERING_PRINCIPLES §7, and the compiler is what enforces it.
      - name: Typecheck
        run: pnpm -r --if-present typecheck

      # Includes:
      #   - the architecture guard (packages/domain imports no framework, calls
      #     no clock, does no floating-point money)
      #   - the acceptance gates, executed against a real Postgres via PGlite
      #   - the RLS proofs, run through an unprivileged role so the policies
      #     actually bind
      - name: Test
        run: pnpm -r --if-present test

      # A production build, because typecheck and tests cannot see what only the
      # build does: prerendering. From 04081ca until c3ee9af `next build` failed
      # on /ops while every check here stayed green, and nobody noticed for
      # three tasks (P3.4.3, 22 Sep 2026).
      - name: Build
        run: pnpm --filter @diyar/web build

  guard:
    name: no forbidden values
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Plain Node, no install: the guard uses builtins only. Pinned to 22 because
      # the script reads `import.meta.dirname` (Node 20.11+), and the runner's
      # preinstalled Node is whatever the image happened to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # DESIGN_DOCTRINE.md and CLAUDE.md §14: no hardcoded colour outside the
      # tokens, and no physical direction utility in an RTL product.
      #
      # This was two grep lines until 21 Sep 2026 (task P0.1.5, DR-13), and they
      # were wrong in both directions: they matched inside COMMENTS, so the
      # guard failed on its own documentation, and they matched `#RRGGBB\b`,
      # which never fires on Tailwind's `#2C221A_0%` because `_` is a word
      # character — nine real hardcoded colours walked past it. The script
      # strips comments with a lexer that knows what a string is, drops the
      # word boundary, states its one artwork exemption with the reason, and
      # checks its own matchers before trusting them.
      - name: No forbidden values
        run: node scripts/guard/forbidden-values.mjs

  # The browser suites (P3.4.3). Each job gets its OWN server and a fresh
  # database, because the one-time-code rate limit lives in the server process
  # and several cases count rows: a second suite against the same process fails
  # tests that have nothing to do with it (logged 21 Sep 2026).
  #
  # Against the DEV server, not a production build, deliberately. A built app
  # runs with NODE_ENV=production, and there the startup guard refuses to boot
  # while any stub is configured — which, until the SMS sender and Sentry exist,
  # is always. Relaxing that guard for tests is a security-critical change and
  # is recorded as an open question in the plan (P3.4.3), not made here.
  #
  # A 4 GB heap for the dev server, because `next dev` restarts ITSELF when the
  # used heap passes 80% of the limit (next/dist/server/lib/start-server.js),
  # and a restart throws away every compiled route. With the runner's default
  # limit, compiling all thirty routes up front crossed that line: on 4ace8f0
  # both suites saw "approaching the used memory threshold, restarting", and
  # the audit then timed out waiting for a page that was compiling again.
  e2e:
    name: browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # Codes are read from a file the app writes (the OTP outbox), not scraped
      # from the server log. The outbox sender is a declared stub, refused in
      # production, so this hook cannot exist where it would matter.
      - name: Start the app
        run: |
          (cd apps/web && NODE_OPTIONS=--max-old-space-size=4096 OTP_OUTBOX="$RUNNER_TEMP/otp.jsonl" pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && exit 0; sleep 5; done
          echo "the app did not start"; tail -50 "$RUNNER_TEMP/dev.log"; exit 1

      # Compile every route before a test navigates to one. The dev server
      # compiles on first request, and the first CI run lost a navigation to it.
      - name: Warm every route
        run: node apps/web/scripts/warm.mjs

      - name: Browser suite
        run: node apps/web/scripts/e2e.mjs
        env:
          OTP_OUTBOX: ${{ runner.temp }}/otp.jsonl

      # Memory and every restart, not only the last lines: the restart that
      # broke 4ace8f0 had scrolled out of a 200-line tail by the time anyone
      # looked, and "connection refused" alone cannot say who stopped the server.
      - name: Server log, when something failed
        if: failure()
        run: |
          free -m
          ps -eo rss,args --sort=-rss | head -5 | cut -c1-160
          grep -n -E 'memory threshold|Ready in|Killed|heap|ECONNRESET' "$RUNNER_TEMP/dev.log" || true
          sudo dmesg 2>/dev/null | grep -i -E 'out of memory|oom' | tail -5 || true
          tail -200 "$RUNNER_TEMP/dev.log"

  a11y:
    name: accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start the app
        run: |
          (cd apps/web && NODE_OPTIONS=--max-old-space-size=4096 OTP_OUTBOX="$RUNNER_TEMP/otp.jsonl" pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && exit 0; sleep 5; done
          echo "the app did not start"; tail -50 "$RUNNER_TEMP/dev.log"; exit 1

      # Every surface, every width, axe WCAG 2 AA, RTL fill edges, focus rings,
      # 44pt targets — once per theme. One run signs in twice (a house and an
      # operator), so two runs spend four codes against a limit of five an hour
      # per number, and can share the server.
      - name: Warm every route
        run: node apps/web/scripts/warm.mjs

      - name: Accessibility audit (noir)
        run: node scripts/audit.mjs
        working-directory: apps/web
        env:
          OTP_OUTBOX: ${{ runner.temp }}/otp.jsonl

      - name: Accessibility audit (paper)
        run: node scripts/audit.mjs
        working-directory: apps/web
        env:
          OTP_OUTBOX: ${{ runner.temp }}/otp.jsonl
          THEME: light

      # Memory and every restart, not only the last lines: the restart that
      # broke 4ace8f0 had scrolled out of a 200-line tail by the time anyone
      # looked, and "connection refused" alone cannot say who stopped the server.
      - name: Server log, when something failed
        if: failure()
        run: |
          free -m
          ps -eo rss,args --sort=-rss | head -5 | cut -c1-160
          grep -n -E 'memory threshold|Ready in|Killed|heap|ECONNRESET' "$RUNNER_TEMP/dev.log" || true
          sudo dmesg 2>/dev/null | grep -i -E 'out of memory|oom' | tail -5 || true
          tail -200 "$RUNNER_TEMP/dev.log"
